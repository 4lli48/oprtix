<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Orbital conjunction analysis and collision-avoidance maneuver demonstration — real TLE data, SGP4 propagation, RK4+J2 numerical integration, multi-attribute optimization." />
    <title>ORION — Orbital Conjunction Assessment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">

      <!-- Full-screen 3D canvas -->
      <div id="canvas-container"></div>
      <div id="tag-layer"></div>

      <!-- Top HUD bar -->
      <header id="hud-top" role="banner">
        <div class="hud-top-left">
          <div class="wordmark">
            <span class="wordmark-orion">ORION</span>
            <span class="wordmark-sub">ORBITAL CONJUNCTION ASSESSMENT</span>
          </div>
          <div class="hud-vdiv"></div>
          <span class="hud-object-name" id="hud-object-name">—</span>
        </div>

        <div class="hud-top-center">
          <div id="status" class="mission-status" data-tone="idle" role="status" aria-live="polite">
            <span class="ms-dot"></span>
            <span id="status-text">ACQUIRING ORBITAL DATA</span>
          </div>
        </div>

        <div class="hud-top-right">
          <div class="hud-meta-item">
            <span class="hud-meta-label">SOURCE</span>
            <span id="data-source" class="hud-meta-value">—</span>
          </div>
          <div class="hud-vdiv"></div>
          <div class="hud-meta-item">
            <span class="hud-meta-label">UTC</span>
            <span id="clock" class="hud-meta-value mono">--:--:--</span>
          </div>
        </div>
      </header>

      <!-- Left sidebar panel -->
      <aside id="panel" aria-label="Mission analysis"></aside>

      <!-- Bottom maneuver strip -->
      <section id="bottom" class="hidden" aria-label="Maneuver comparison"></section>

      <!-- Scene time overlay -->
      <div id="stage-time" class="hud-scene-time hidden">
        <span class="hud-scene-time-label">SCENARIO TIME</span>
        <strong id="stage-time-value" class="mono">--:--:-- UTC</strong>
      </div>

      <!-- Scene legend -->
      <div id="legend" class="hud-legend"></div>

      <!-- View toolbar -->
      <div id="toolbar" class="hud-toolbar">
        <button class="tb-btn active" data-view="OVERVIEW">OVERVIEW</button>
        <button class="tb-btn" data-view="SATELLITE">SATELLITE</button>
        <button class="tb-btn" id="btn-encounter" data-view="ENCOUNTER" disabled>ENCOUNTER</button>
      </div>

      <!-- System log -->
      <footer id="logbar">
        <div class="log-strip">
          <button class="log-toggle" id="log-toggle" aria-expanded="false">▶ SYS LOG</button>
          <span class="log-pipe"></span>
          <span id="log-latest" class="log-latest">—</span>
          <label class="pacing-label">
            PACING
            <select id="pacing" class="pacing-select">
              <option value="550" selected>NORMAL</option>
              <option value="250">FAST</option>
              <option value="0">INSTANT</option>
            </select>
          </label>
        </div>
        <ol class="log-list hidden" id="log-list"></ol>
      </footer>

    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
